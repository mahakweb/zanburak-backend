[program:zanburak-reverb]
process_name=%(program_name)s
command=php /var/www/zanburak-backend/artisan reverb:start --host=127.0.0.1 --port=8081
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/zanburak-backend/storage/logs/reverb.log
stopwaitsecs=10
