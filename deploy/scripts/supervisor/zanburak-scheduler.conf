[program:zanburak-scheduler]
process_name=%(program_name)s
command=php /var/www/zanburak-backend/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/zanburak-backend/storage/logs/scheduler.log
stopwaitsecs=10
